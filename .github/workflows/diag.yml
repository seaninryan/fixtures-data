name: diag
on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe galwayfa.ie from a runner
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          AJAX='https://galwayfa.ie/wp-admin/admin-ajax.php?action=fixtures&club_id=2960&competition_id=&team_id=&displayResults='
          PAGE='https://galwayfa.ie/clubprofile/2960/'
          echo "runner egress IP: $(curl -s https://api.ipify.org)"

          echo "===== 1. THE FULL 403 BODY (geo-block and rule-block say different things)"
          curl -s -X POST -H "User-Agent: $UA" -H "Referer: $PAGE" "$AJAX" | sed -e 's/<[^>]*>//g' | tr -s '\n ' '\n ' | head -20

          echo "===== 2. Does the club PAGE (200 from here) carry the fixture markup?"
          curl -s -H "User-Agent: $UA" "$PAGE" -o /tmp/page
          echo "page bytes: $(wc -c < /tmp/page)"
          for needle in 'data-fid' 'data-date' 'fixture' 'team_id' 'admin-ajax'; do
            printf '  %-12s %s\n' "$needle" "$(grep -o "$needle" /tmp/page | wc -l)"
          done

          echo "===== 3. Other wp-admin paths, and wp-json, from here"
          for u in \
            'https://galwayfa.ie/wp-admin/admin-ajax.php?action=heartbeat' \
            'https://galwayfa.ie/wp-json/' \
            'https://galwayfa.ie/robots.txt' ; do
            printf '  %-70s %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: $UA" "$u")"
          done

          echo "===== 4. Is it the PATH or the QUERY? (same path, no query)"
          printf '  bare admin-ajax POST:      %s\n' "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "User-Agent: $UA" 'https://galwayfa.ie/wp-admin/admin-ajax.php')"
          printf '  action as POST body:       %s\n' "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "User-Agent: $UA" -H "Referer: $PAGE" --data 'action=fixtures&club_id=2960&competition_id=&team_id=&displayResults=' 'https://galwayfa.ie/wp-admin/admin-ajax.php')"
